services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: max
      POSTGRES_PASSWORD: max
      POSTGRES_DB: max
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U max"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  pgdata:
